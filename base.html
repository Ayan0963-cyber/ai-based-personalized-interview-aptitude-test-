<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SkillPrep AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('home') }}"><span class="brand-icon">✦</span> SkillPrep AI</a>
  <nav><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('profile') }}">Get Started</a><a href="{{ url_for('dashboard') }}">Dashboard</a></nav>
  {% if session.get('student') %}<span class="user-pill">👤 {{ session['student']['name'] }}</span>{% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
<footer>SkillPrep AI <span>•</span> Smarter Preparation · Better Opportunities · Brighter Future</footer>
</body>
</html>
