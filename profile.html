{% extends "base.html" %}{% block title %}Student Profile{% endblock %}
{% block content %}
<section class="form-card narrow">
  <div class="steps"><b>1 Profile</b><span>2 Aptitude</span><span>3 Interview</span><span>4 Results</span></div>
  <h2>Let's Set Up Your Profile</h2><p class="muted">Tell us about yourself so we can personalize your preparation journey.</p>
  <form method="POST">
    <label>Full Name</label><input name="name" placeholder="Enter your full name" required>
    <label>Target Job Role</label><select name="role"><option>Software Developer</option><option>Data Analyst</option><option>AI/ML Engineer</option><option>General / Fresher</option></select>
    <label>Your Skills (comma separated)</label><textarea name="skills" placeholder="e.g. Python, Java, HTML, CSS, SQL"></textarea>
    <button class="btn full">Continue →</button>
  </form>
</section>
{% endblock %}
